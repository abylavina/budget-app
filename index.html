<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#F6F5F2;
    --surface:#FFFFFF;
    --line:#E4E2DC;
    --ink:#101010;
    --ink-soft:#6B6963;
    --income:#0F3D36;
    --expense:#5C1626;
    --accent:#23324C;
    --income-tint:#E3EDEA;
    --expense-tint:#F2E4E6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    padding-bottom:96px;
    min-height:100vh;
  }
  header{
    padding:20px 20px 20px;
  }
  .month{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    font-weight:500;
    margin-bottom:6px;
  }
  .balance-label{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:400;
    margin-bottom:2px;
  }
  .balance{cursor:pointer;}
  .balance:active{opacity:.6;}
  .balance-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .balance{
    font-size:48px;
    font-weight:500;
    letter-spacing:-0.02em;
    line-height:1.1;
  }
  .balance sup{
    font-size:20px;
    font-weight:300;
    margin-left:2px;
  }
  .stats{
    display:flex;
    gap:1px;
    background:var(--line);
    margin:0 20px;
    border:1px solid var(--line);
  }
  .stat{
    flex:1;
    background:var(--surface);
    padding:16px 16px 18px;
  }
  .stat-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
    font-weight:500;
  }
  .stat-value{
    font-size:22px;
    font-weight:400;
    letter-spacing:-0.01em;
  }
  .stat.income{background:var(--income-tint);}
  .stat.expense{background:var(--expense-tint);}
  .stat.income .stat-value{color:var(--income);font-weight:500;}
  .stat.expense .stat-value{color:var(--expense);font-weight:500;}

  .section-title{
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    padding:24px 20px 10px;
  }

  .tx-list{
    margin:0 20px;
    border-top:1px solid var(--line);
  }
  .tx{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .tx-icon{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
    flex-shrink:0;
  }
  .tx-body{flex:1;min-width:0;}
  .tx-note{
    font-size:15px;
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tx-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .tx-amount{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
  }
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .tx-amount.transfer{color:var(--accent);}

  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .actions{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    gap:1px;
    background:var(--line);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .actions button{
    flex:1;
    border:none;
    padding:19px 0;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
  }
  .actions button.income-btn{background:var(--income);}
  .actions button.expense-btn{background:var(--expense);}
  .actions button.transfer-btn{background:var(--accent);}
  .actions button.income-btn:active{background:#0A2A25;}
  .actions button.expense-btn:active{background:#420E1A;}
  .actions button.transfer-btn:active{background:#182238;}
  .actions button{font-size:13.5px;padding-left:2px;padding-right:2px;}

  .sheet-overlay{
    position:fixed;inset:0;
    background:rgba(22,22,22,.4);
    display:none;
    align-items:flex-end;
    z-index:10;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    border-radius:16px 16px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet-title{
    font-size:18px;
    font-weight:500;
    margin-bottom:18px;
  }
  .field-label{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:500;
    margin:14px 0 6px;
  }
  .amount-input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    font-size:32px;
    font-weight:300;
    padding:6px 0;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
  }
  .amount-input:focus{outline:none;border-bottom-color:var(--ink);}
  .text-input, .date-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:var(--bg);
  }
  .text-input:focus, .date-input:focus{outline:none;border-color:var(--ink);}
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .cat-chip{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 4px;
    text-align:center;
    font-size:11px;
    background:var(--bg);
    color:var(--ink-soft);
  }
  .cat-chip .ic{display:block;font-size:18px;margin-bottom:4px;}
  .cat-chip.selected{
    border-color:var(--ink);
    color:#fff;
    background:var(--ink);
  }
  .sheet-submit{
    width:100%;
    margin-top:22px;
    border:none;
    border-radius:10px;
    padding:16px 0;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--ink);
  }
  .sheet-submit:disabled{opacity:.4;}
  .sheet-close{
    position:absolute;
    right:20px;top:18px;
    border:none;background:none;
    font-size:20px;color:var(--ink-soft);
    padding:4px;
  }
  .sheet{position:relative;}

  .placeholder{
    margin:40px 20px;
    padding:28px 20px;
    border:1px solid var(--line);
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.5;
  }

  .cover{
    position:relative;
    height:230px;
    overflow:hidden;
  }
  .cover svg, .cover img{
    width:100%;height:100%;
    display:block;
    object-fit:cover;
    object-position:center 78%;
  }
  .cover-text{
    position:absolute;
    left:20px;bottom:16px;
    color:#F4F2ED;
  }
  .cover-title{
    font-size:22px;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .cover-sub{
    font-size:12px;
    font-weight:400;
    opacity:.75;
    margin-top:2px;
  }

  .cards-list{
    margin:0 20px;
    border-top:1px solid var(--line);
  }
  .card-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .card-row:active{background:var(--bg);}
  .card-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:-8px 0 14px;
  }
  .card-icon{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    flex-shrink:0;
  }
  .card-name{
    flex:1;
    font-size:15px;
  }
  .card-balance{
    font-size:15px;
    font-weight:600;
    color:var(--expense);
    white-space:nowrap;
  }
  .cards-total-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0 4px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .cards-total-row b{
    color:var(--expense);
    font-weight:600;
  }

  .collapsible-header{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    padding:24px 20px 10px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .collapsible-title{
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .collapsible-summary{
    flex:1;
    text-align:right;
    font-size:14px;
    font-weight:600;
    color:var(--expense);
  }
  .chevron{
    font-size:14px;
    line-height:1;
    color:var(--ink-soft);
    transition:transform .2s ease;
    flex:0 0 auto;
  }
  .collapsible.open .chevron{transform:rotate(180deg);}
  .collapsible-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .collapsible.open .collapsible-body{max-height:640px;}
</style>
</head>

    <span class="collapsible-summary" id="cardsSummary">—</span>
    <span class="chevron">⌄</span>
  </button>
  <div class="collapsible-body" id="cardsBody">
    <div class="cards-list" id="cardsList"></div>
  </div>
</div>

<div class="section-title">Операции</div>
<div class="tx-list" id="txList"></div>

<div class="actions">
  <button class="income-btn" id="btnIncome">+ Доход</button>
  <button class="expense-btn" id="btnExpense">− Расход</button>
  <button class="transfer-btn" id="btnTransfer">⇄ Перевод</button>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <button class="sheet-close" id="sheetClose">✕</button>
    <div class="sheet-title" id="sheetTitle">Новая операция</div>

    <div class="field-label">Сумма</div>
    <input type="number" inputmode="decimal" class="amount-input" id="amountInput" placeholder="0">

    <div id="catField">
      <div class="field-label" id="catFieldLabel">Категория</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div id="noteField">
      <div class="field-label">Назначение платежа</div>
      <input type="text" class="text-input" id="noteInput" placeholder="Например: Costco">
    </div>

    <div id="dateField">
      <div class="field-label">Дата</div>
      <input type="date" class="date-input" id="dateInput">
    </div>

    <button class="sheet-submit" id="submitBtn" disabled>Добавить</button>
  </div>
</div>

<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  var state = { data: null, type: null, selectedCat: null };

  function fmt(n){
    return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' $';
  }

  function render(){
    var d = state.data;
    var cards = d.creditCards || [];
    var income = d.transactions.filter(function(t){return t.type==='income';})
                  .reduce(function(s,t){return s+t.amount;},0);
    var expense = d.transactions.filter(function(t){return t.type==='expense';})
                  .reduce(function(s,t){return s+t.amount;},0);
    var transfers = d.transactions.filter(function(t){return t.type==='transfer';});

    // текущий баланс карты = базовый долг + все погашения по этой карте
    var cardById = {};
    cards.forEach(function(c){ cardById[c.id] = c; c._current = c.balance; });
    transfers.forEach(function(t){
      if (cardById[t.cardId]) cardById[t.cardId]._current += t.amount;
    });

    var cardsDebt = cards.reduce(function(s,c){return s+c._current;},0);
    document.getElementById('cardsSummary').textContent = fmt(cardsDebt);
    var cash = d.startBalance + income - expense;
    var balance = cash + cardsDebt;

    document.getElementById('monthLabel').textContent = d.month;
    document.getElementById('balanceValue').innerHTML = fmt(balance).replace(' $', ' <sup>$</sup>');
    document.getElementById('incomeValue').textContent = fmt(income);
    document.getElementById('expenseValue').textContent = fmt(expense);

    var cardsList = document.getElementById('cardsList');
    if (cards.length === 0){
      cardsList.innerHTML = '<div class="empty">Нет добавленных карт</div>';
    } else {
      cardsList.innerHTML = cards.map(function(c){
        return '<div class="card-row" data-card-id="'+c.id+'">' +
          '<div class="card-icon">\uD83D\uDCB3</div>' +
          '<div class="card-name">'+c.name+'</div>' +
          '<div class="card-balance">'+fmt(c._current)+'</div>' +
        '</div>';
      }).join('') +
      '<div class="cards-total-row"><span>Итого долг по картам</span><b>'+fmt(cardsDebt)+'</b></div>' +
      '<div class="card-hint">Нажми на карту, чтобы задать баланс</div>';

      Array.prototype.forEach.call(cardsList.querySelectorAll('.card-row'), function(row){
        row.addEventListener('click', function(){
          openBalanceSheet(row.getAttribute('data-card-id'));
        });
      });
    }

    var catById = {};
    d.categories.income.concat(d.categories.expense).forEach(function(c){ catById[c.id]=c; });

    var list = document.getElementById('txList');
    var sorted = d.transactions.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    if (sorted.length === 0){
      list.innerHTML = '<div class="empty">Пока нет операций — добавь первую кнопкой внизу</div>';
      return;
    }
    list.innerHTML = sorted.map(function(t){
      var dateStr = new Date(t.date).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});

      if (t.type === 'transfer'){
        var card = cardById[t.cardId];
        var cardName = card ? card.name : 'карта';
        return '<div class="tx">' +
          '<div class="tx-icon">\uD83D\uDD01</div>' +
          '<div class="tx-body">' +
            '<div class="tx-note">'+(t.note || ('Погашение — '+cardName))+'</div>' +
            '<div class="tx-meta">Перевод · '+dateStr+'</div>' +
          '</div>' +
          '<div class="tx-amount transfer">−'+fmt(t.amount)+'</div>' +
        '</div>';
      }

      var cat = catById[t.category] || {icon:'•', label:t.category};
      var sign = t.type === 'income' ? '+' : '−';
      return '<div class="tx">' +
        '<div class="tx-icon">'+cat.icon+'</div>' +
        '<div class="tx-body">' +
          '<div class="tx-note">'+(t.note || cat.label)+'</div>' +
          '<div class="tx-meta">'+cat.label+' · '+dateStr+'</div>' +
        '</div>' +
        '<div class="tx-amount '+t.type+'">'+sign+fmt(t.amount)+'</div>' +
      '</div>';
    }).join('');
  }

  function openSheet(type){
    state.type = type;
    state.selectedCat = null;
    var titles = { income: 'Новый доход', expense: 'Новый расход', transfer: 'Погашение кредитки' };
    document.getElementById('sheetTitle').textContent = titles[type];
    document.getElementById('catFieldLabel').textContent = type === 'transfer' ? 'Карта' : 'Категория';
    document.getElementById('catField').style.display = '';
    document.getElementById('noteField').style.display = '';
    document.getElementById('dateField').style.display = '';
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
    document.getElementById('submitBtn').textContent = 'Добавить';

    var grid = document.getElementById('catGrid');
    var items = type === 'transfer'
      ? (state.data.creditCards || []).map(function(c){ return { id: c.id, icon: '💳', label: c.name }; })
      : state.data.categories[type];

    grid.innerHTML = items.map(function(c){
      return '<div class="cat-chip" data-id="'+c.id+'"><span class="ic">'+c.icon+'</span>'+c.label+'</div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.cat-chip'), function(chip){
      chip.addEventListener('click', function(){
        Array.prototype.forEach.call(grid.querySelectorAll('.cat-chip'), function(c){c.classList.remove('selected');});
        chip.classList.add('selected');
        state.selectedCat = chip.getAttribute('data-id');
        checkValid();
      });
    });
    checkValid();
    document.getElementById('sheetOverlay').classList.add('open');
  }

  function openBalanceSheet(cardId){
    var card = (state.data.creditCards || []).find(function(c){ return c.id === cardId; });
    if (!card) return;
    state.type = 'balance-edit';
    state.editingCardId = cardId;

    document.getElementById('sheetTitle').textContent = 'Баланс — ' + card.name;
    document.getElementById('catField').style.display = 'none';
    document.getElementById('noteField').style.display = 'none';
    document.getElementById('dateField').style.display = 'none';
    document.getElementById('amountInput').value = card.balance;
    document.getElementById('submitBtn').textContent = 'Сохранить';

    checkValid();
    document.getElementById('sheetOverlay').classList.add('open');
  }

  function openStartBalanceSheet(){
    state.type = 'start-balance-edit';

    document.getElementById('sheetTitle').textContent = 'Начальный баланс';
    document.getElementById('catField').style.display = 'none';
    document.getElementById('noteField').style.display = 'none';
    document.getElementById('dateField').style.display = 'none';
    document.getElementById('amountInput').value = state.data.startBalance;
    document.getElementById('submitBtn').textContent = 'Сохранить';

    checkValid();
    document.getElementById('sheetOverlay').classList.add('open');
  }

  function closeSheet(){
    document.getElementById('sheetOverlay').classList.remove('open');
  }

  function checkValid(){
    var amount = parseFloat(document.getElementById('amountInput').value);
    var valid;
    if (state.type === 'balance-edit' || state.type === 'start-balance-edit'){
      valid = !isNaN(amount);
    } else {
      valid = amount > 0 && state.selectedCat;
    }
    document.getElementById('submitBtn').disabled = !valid;
  }

  document.getElementById('cardsToggle').addEventListener('click', function(){
    document.getElementById('cardsSection').classList.toggle('open');
  });

  document.getElementById('balanceValue').addEventListener('click', openStartBalanceSheet);

  document.getElementById('amountInput').addEventListener('input', checkValid);
  document.getElementById('btnIncome').addEventListener('click', function(){ openSheet('income'); });
  document.getElementById('btnExpense').addEventListener('click', function(){ openSheet('expense'); });
  document.getElementById('btnTransfer').addEventListener('click', function(){ openSheet('transfer'); });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetOverlay').addEventListener('click', function(e){
    if (e.target === this) closeSheet();
  });

  document.getElementById('submitBtn').addEventListener('click', function(){
    var amount = parseFloat(document.getElementById('amountInput').value);

    if (state.type === 'start-balance-edit'){
      state.data.startBalance = amount;
      render();
      closeSheet();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      return;
    }

    if (state.type === 'balance-edit'){
      var card = (state.data.creditCards || []).find(function(c){ return c.id === state.editingCardId; });
      if (card) card.balance = amount;
      render();
      closeSheet();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      return;
    }

    var note = document.getElementById('noteInput').value.trim();
    var date = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
    var newTx = { id: Date.now(), type: state.type, amount: amount, note: note, date: date };
    if (state.type === 'transfer') {
      newTx.cardId = state.selectedCat;
    } else {
      newTx.category = state.selectedCat;
    }
    state.data.transactions.push(newTx);
    render();
    closeSheet();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  });

  function showPlaceholder(){
    document.querySelector('header').insertAdjacentHTML('afterend',
      '<div class="placeholder">Не получилось загрузить данные.<br>Проверь подключение и открой приложение заново.</div>');
    document.querySelectorAll('.stats, .section-title, .tx-list').forEach(function(el){ el.style.display='none'; });
  }

  fetch('data.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('bad response'); return r.json(); })
    .then(function(json){ state.data = json; render(); })
    .catch(function(err){ console.error(err); showPlaceholder(); });
</script>

</body>
</html>
